<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login y Registro - Proactive Nutrition</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <input type="checkbox" id="toggle-form">

    <div class="login-card">
        
        <div id="alerta-correo" style="display: none; background: #D4EDDA; color: #155724; border: 1px solid #c3e6cb; padding: 12px; border-radius: 8px; margin-bottom: 15px; font-weight: bold; font-size: 13px;">
            Revisa tu correo electrónico. Te hemos enviado las instrucciones.
        </div>

        <div class="logo-placeholder">
            <img src="img/logo.png" alt="Logo" style="width: 100%; border-radius: 50%;">
        </div>
        
        <h2 style="margin: 0;">Proactive Nutrition</h2>
        <p style="color: #000000; margin-bottom: 30px;">Sistema de Gestión de inventario</p>

        <div class="login-section" id="bloque-login">
            <form id="formLogin">
                <div class="input-group">
                    <label>Correo Electrónico</label>
                    <input type="email" id="loginEmail" placeholder="correo@gmail.com" required>
                </div>
                
                <div class="input-group">
                    <label>Contraseña</label>
                    <input type="password" id="loginPassword" placeholder="**********" minlength="8" required>
                </div>

                <button type="submit" class="btn-login">Iniciar sesión</button>
            </form>
            <label for="toggle-form" class="toggle-link">¿No tienes cuenta? Regístrate aquí</label>
            
            <label class="toggle-link" id="btn-ir-recuperar" style="margin-top: 8px; cursor: pointer;">¿Olvidaste tu contraseña?</label>
        </div>

        <div class="register-section">
            <form id="formRegistro"> 
                <div class="input-group">
                    <label>Nombre</label>
                    <input type="text" id="regNombre" placeholder="Ej. Sebastian Perez" required>
                </div>

                <div class="input-group">
                    <label>Correo Electrónico</label>
                    <input type="email" id="regEmail" placeholder="correo@ejemplo.com" required>
                </div>
                
                <div class="input-group">
                    <label>Contraseña</label>
                    <input type="password" id="regPassword" placeholder="**********" minlength="6" required>
                </div>

                <button type="submit" class="btn-login">Enviar</button>
            </form>
            <label for="toggle-form" class="toggle-link">¿Ya tienes cuenta? Inicia sesión</label>
        </div>

        <div class="recovery-section" id="bloque-recuperar" style="display: none;">
            <form id="formRecuperar">
                <div class="input-group">
                    <label>Ingresa tu correo registrado</label>
                    <input type="email" placeholder="ejemplo@gmail.com" required>
                </div>
                <button type="submit" class="btn-login" style="background: #000000; color: white;">Enviar</button>
            </form>
            
            <label class="toggle-link" id="btn-volver-login" style="margin-top: 15px; font-weight: bold; cursor: pointer;">Iniciar sesión</label>
        </div>

        <p style="font-size: 12px; margin-top: 30px;">© 2026 proactive nutrition, Inc.</p>
        <div class="color-bar">
            <div class="bar" style="background: #FF0606;"></div> 
            <div class="bar" style="background: #9120B7;"></div> 
            <div class="bar" style="background: #49D93B;"></div> 
        </div>
    </div>

    <script src="javita.js"></script>
</body>
</html>
